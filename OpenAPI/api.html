<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open-Meteo Weather Dashboard</title>
    <link rel="stylesheet" href="api.css" />
  </head>

  <body>
    <nav>
      <a href="../index.html">← Home</a>
    </nav>

    <h1>Open-Meteo Weather Dashboard</h1>

    <!-- Search Box -->
    <div class="search">
      <input
        type="text"
        id="cityInput"
        placeholder="Enter a city (e.g., Atlanta)"
      />
      <button id="searchBtn">Search</button>
    </div>

    <!-- Weather Buttons -->
    <div class="buttons">
      <button id="current">Current Weather</button>
      <button id="hourly">Hourly Weather</button>
      <button id="daily">Daily Weather</button>
    </div>

    <!-- Weather Results -->
    <div id="results"></div>

    <!-- Weather Icon -->
    <div id="weatherIcon"></div>

    <script src="api.js"></script>
  </body>
</html>
